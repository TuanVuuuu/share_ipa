        <div class="catalog-sk-card">

            <div class="sk sk-line sk-catalog-meta"></div>

            </div>
            <div class="sk sk-line sk-catalog-meta"></div>
            <div class="sk sk-line sk-catalog-meta-short"></div>
            <div class="sk sk-catalog-btn"></div>
        </div>
    </div>

    <div id="platform-list" class="catalog-grid"></div>
    <div id="platform-empty" class="catalog-empty" style="display:none;">Chưa có ứng dụng nào.</div>
</div>

<script src="/js/catalog-detail.js?v=__V__"></script>
